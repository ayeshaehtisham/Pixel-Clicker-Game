<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Pixel Clicker </title>

  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css">

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-bolt logo-icon"></i>
      <span>Pixel Clicker</span>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="play.html">How to Play</a>
      <a href="#">Leaderboard</a>
    </nav>
    <button class="btn-primary" id="playNavBtn" onclick="startGame()">Play Now</button>
  </header>

  <!-- Main Application Container -->
  <main class="main-container">
    
    <!-- Left Section: Game Canvas / Play Area -->
    <section class="game-card">
      <div class="game-header">
        <div class="stat-box">
          <span class="stat-label">Score:</span>
          <span class="stat-value" id="currentScore">0</span>
        </div>
        <div class="stat-box">
          <i class="fa-regular fa-clock"></i>
          <span class="stat-label">Time:</span>
          <span class="stat-value" id="timer">10s</span>
        </div>
      </div>

      <!-- Interactive Game Box -->
      <div class="click-area" id="clickArea">
        <div class="grid-background"></div>
        <div class="coin-wrapper" id="coin">
          <!-- Pixel-style SVG Coin -->
          <svg class="pixel-coin" viewBox="0 0 100 100" width="130" height="130">
            <circle cx="50" cy="50" r="45" fill="#facc15" stroke="#ca8a04" stroke-width="6"/>
            <circle cx="50" cy="50" r="35" fill="#fde047" stroke="#eab308" stroke-width="4"/>
            <text x="50" y="62" font-family="'Courier New', monospace" font-weight="900" font-size="40" fill="#a16207" text-anchor="middle">C</text>
          </svg>
          <div class="sparkles">
            <span class="sparkle s1"></span>
            <span class="sparkle s2"></span>
            <span class="sparkle s3"></span>
            <span class="sparkle s4"></span>
          </div>
        </div>
      </div>

      <div class="instruction-banner">
        <span id="gameMessage">Click as fast as you can!</span>
      </div>
    </section>

    <!-- Right Section: Leaderboard & Stats -->
    <aside class="sidebar">
      
      <!-- Leaderboard Card -->
      <div class="leaderboard-card">
        <div class="leaderboard-title">
          <i class="fa-solid fa-crown crown-icon"></i>
          <h2>Leaderboard</h2>
        </div>

        <div class="tabs">
          <button class="tab-btn active">All Time</button>
          <button class="tab-btn">Today</button>
          <button class="tab-btn">This Week</button>
        </div>

        <div class="leaderboard-table-header">
          <span>#</span>
          <span>Player</span>
          <span class="text-right">Score</span>
        </div>

        <ul class="leaderboard-list" id="leaderboardList">
          <!-- Dynamically populated via JavaScript -->
        </ul>
      </div>

      <!-- Best Score Banner -->
      <div class="best-score-card">
        <div class="best-score-header">
          <i class="fa-solid fa-trophy trophy-icon"></i>
          <span>Your Best Score</span>
        </div>
        <div class="best-score-value" id="userBestScore">0</div>
      </div>

    </aside>

  </main>

  <!-- Name Input Modal (Prompted when game ends) -->
  <div class="modal-overlay" id="scoreModal">
    <div class="modal">
      <h2>Game Over!</h2>
      <p>You scored <strong id="finalScore">0</strong> points!</p>
      <input type="text" id="playerName" placeholder="Enter your player name" maxlength="12">
      <button class="btn-primary" onclick="submitScore()">Submit Score</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
